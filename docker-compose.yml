services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chinese-sale-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssreuven2026!"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile

    container_name: chinese-sale-api

    ports:
      - "8088:8080"

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      EnableHttpsRedirection: "false"
      EnableSwagger: "true"
      ConnectionStrings__DefaultConnection: "Server=db;Database=ChineseSale;User Id=sa;Password=P@ssreuven2026!;TrustServerCertificate=True;Encrypt=False;"

    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: chinese-sale-client

    ports:
      - "4200:4200"

    depends_on:
      - api

volumes:
  sql_data: