<div class="page-wrapper">
  <div class="form-card">
    <div class="form-header">
      <div class="icon-circle">🎁</div>
      <h3>{{ isNew ? 'הוספת מתנה חדשה' : 'עריכת מתנה' }}</h3>
      <p class="subtitle">מלא את הפרטים כדי להציג את המתנה בקטלוג</p>
    </div>

    <form class="gift-form">
      <div class="form-grid">
     
        <div class="input-group">
          <label for="name">שם המתנה</label>
          <input [(ngModel)]="curGift.name" name="name" type="text" placeholder="לדוגמה: חופשה חלומית" required maxlength="20">
          <small class="hint">{{ curGift.name?.length || 0 }}/20 תווים</small>
        </div>

        
        <div class="input-group">
          <label for="price">מחיר כרטיס (₪)</label>
          <input type="number" [(ngModel)]="curGift.price" name="price" placeholder="1–100" required min="1" max="100" step="1">
          <small class="hint">מספר שלם בין 1 ל-100</small>
        </div>

       
        <div class="input-group">
          <label>קטגוריה</label>
          <select [(ngModel)]="curGift.categoryId" name="categoryId" required>
            <option [ngValue]="null" disabled selected>בחר קטגוריה...</option>
            <option *ngFor="let c of categories$ | async" [ngValue]="c.id">{{c.name}}</option>
          </select>
        </div>

       
        <div class="input-group">
          <label>תורם</label>
          <select [(ngModel)]="curGift.donorId" name="donorId" required>
            <option [ngValue]="null" disabled selected>בחר תורם...</option>
            <option *ngFor="let d of donors$ | async " [ngValue]="d.id">{{d.name}}</option>
          </select>
        </div>
      </div>

      
      <div class="input-group full-width">
        <label for="imageUrl">כתובת תמונה (URL)</label>
        <input type="text" [(ngModel)]="curGift.imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg" required>
      </div>

     
      <div class="input-group full-width">
        <label for="description">תיאור המתנה</label>
        <textarea [(ngModel)]="curGift.description" name="description" rows="3" placeholder="ספר קצת על המתנה..." required maxlength="70"></textarea>
        <small class="hint">{{ curGift.description?.length || 0 }}/70 תווים</small>
      </div>


      <div class="form-actions">
        <button type="button" class="cancel-btn" routerLink="/gifts">ביטול</button>
        <button type="button" class="save-btn" (click)="saveGift()">
          {{ isNew ? 'צור מתנה עכשיו' : 'עדכן פרטים' }}
        </button>
      </div>

      <div class="error-messages">
        <p *ngIf="errorMessage" class="error-badge">⚠️ {{ errorMessage }}</p>
      </div>
    </form>
  </div>
</div>
