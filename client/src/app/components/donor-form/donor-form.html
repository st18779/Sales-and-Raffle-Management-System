<div class="form-container">
  <h3>{{ isNew ? 'הוספת תורם' : 'עריכת תורם' }}</h3>

  <div class="form-group">
    <label>תעודת זהות / מספר ייחודי לעסק:</label>
    <input [(ngModel)]="curDonor.id" name="name" type="text" required>
  </div>

  <div class="form-group">
    <label>שם התורם:</label>
    <input [(ngModel)]="curDonor.name" name="name" type="text" required>
  </div>

  <div class="form-group">
    <label>אימייל:</label>
    <input [(ngModel)]="curDonor.email" name="email" type="email" required>
  </div>

  <div class="button-group">
    <button (click)="saveDonor()" class="save-btn">שמירה</button>
    <button type="button" (click)="cancel()" class="cancel-btn">ביטול</button>
  </div>
</div>
